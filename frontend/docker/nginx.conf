# nginx config for the ProcessNow frontend image.
# Copied to /etc/nginx/conf.d/default.conf. Included inside `http`, so `map` is legal here.

# Cache-Control is chosen by URI in ONE place. This matters: nginx's `add_header`
# inside a `location` DROPS every header inherited from `server`, so per-location
# cache headers would silently delete the security headers below.
map $uri $process_now_cache_control {
    # index.html, sw.js, registerSW.js, manifest.webmanifest, robots.txt, favicon:
    # the pointers to everything else, so they must be revalidated every load.
    default                     "no-cache";
    # Vite writes content-hashed names under /assets (js, css, fonts, img).
    ~^/assets/                  "public, max-age=31536000, immutable";
    # workbox-<hash>.js sits at the root but is content-hashed like an asset.
    ~^/workbox-[^/]+\.js$       "public, max-age=31536000, immutable";
}

server {
    # nginxinc/nginx-unprivileged runs as uid 101 and cannot bind below 1024.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml font/woff2;
    # No brotli: the stock nginx image ships no ngx_brotli module, so enabling it
    # means building a custom nginx. Do it only if gzip is measurably not enough —
    # the CDN or load balancer in front usually compresses anyway.

    # ---------------------------------------------------------------------------
    # Content-Security-Policy.
    #
    # connect-src names the API origin, derived at image-build time from VITE_API_BASE_URL
    # (see docker/render-nginx-conf.mjs). Without it the browser blocks every API call.
    # Previously required a manual edit: connect-src is 'self' only when no API URL is
    # still open. The API is a separate origin, so every request to it is blocked
    # until that origin is listed here:
    #     connect-src 'self' https://api.example.com;
    # Nothing else in this header needs a decision.
    #
    # __INLINE_SCRIPT_HASHES__ is replaced during the image build by
    # docker/render-nginx-conf.mjs, with one sha256 per inline <script> in the built
    # index.html (the theme no-flash script, and vite-plugin-pwa's service-worker
    # registration). Derived, not pinned, so editing either script cannot silently
    # break the page in production only. This file is not usable as-is outside that
    # build — the render step is what makes it valid.
    #
    # style-src keeps 'unsafe-inline': React writes style attributes, which cannot
    # be hashed.
    # ---------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __INLINE_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'__API_ORIGIN__; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Only has an effect once TLS terminates in front of this container. Harmless
    # over plain HTTP (browsers ignore it), so it ships unconditionally.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # A private business tool: never index it.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $process_now_cache_control always;

    # SPA fallback: client-side routes resolve to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Loopback probe target for HEALTHCHECK; keeps the access log free of it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
